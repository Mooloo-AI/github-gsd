name: Tracking issue
description: Coordinate work too large for one small PR. Attach the children as sub-issues.
labels: ["tracking"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome this group of issues delivers.
    validations:
      required: true
  - type: textarea
    id: sub-issues
    attributes:
      label: Sub-issues
      description: The planned children, in order. Each is an independently shippable slice with one PR. Attach each as a GitHub sub-issue and link dependent ones with blocked-by.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: false
