name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck
        run: shellcheck skills/github-gsd/scripts/issue-comment.sh tests/mocks/gh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Show tool versions
        run: |
          bash --version | head -n 1
          bats --version
          jq --version
      - name: Run tests
        run: bats tests/

  install:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Check the skill's LICENSE copy
        run: cmp LICENSE skills/github-gsd/LICENSE
      - name: Install with the skills CLI
        run: |
          project="$RUNNER_TEMP/project"
          mkdir -p "$project"
          cd "$project"
          npx --yes skills@1.7.1 add "$GITHUB_WORKSPACE" -a claude-code -a codex -y
      - name: Check the installed files
        run: |
          skill="$RUNNER_TEMP/project/.agents/skills/github-gsd"
          for path in SKILL.md LICENSE steps/start.md templates/config.md scripts/issue-comment.sh; do
            test -f "$skill/$path" || { echo "missing: $path"; exit 1; }
          done
          test -x "$skill/scripts/issue-comment.sh"
          test -f "$RUNNER_TEMP/project/.claude/skills/github-gsd/SKILL.md"
          grep -qx 'name: github-gsd' "$skill/SKILL.md"
