name: Release

# release-please maintains a release PR from Conventional Commits. Merging that
# PR updates CHANGELOG.md and VERSION, tags vX.Y.Z, and creates the GitHub
# Release. Installs track main, so the release records changes; it ships nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
